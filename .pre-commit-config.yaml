exclude: ^typings/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: check-graphify-lfs
        name: check graphify lfs
        entry: bash -c 'for f in graphify-out/graph.json graphify-out/graph.html; do if [ -f "$f" ]; then if ! grep -q "version https://git-lfs.github.com/spec/v1" "$f"; then echo "Error: $f is not an LFS pointer! Check .gitattributes precedence."; exit 1; fi; fi; done'
        language: system
        pass_filenames: false
