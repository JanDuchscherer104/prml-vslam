[project]
name = "prml-vslam"
version = "0.1.0"
description = "Off-device monocular VSLAM benchmark scaffold for uncalibrated smartphone video."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Jan Duchscherer", email = "j.duchscherer@gmail.com" }]
dependencies = [
  "numpy>=1.26,<3",
  "av>=16,<17",
  "scipy>=1.13,<2",
  "opencv-python>=4.10,<5",
  "open3d>=0.19.0,<0.20",
  "matplotlib>=3.8,<4",
  "pooch>=1.8,<2",
  "plotly>=6.6.0,<7",
  "evo>=1.31,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.14,<3",
  "ray>=2.40,<3",
  "rich>=13.7,<15",
  "seaborn>=0.13,<1",
  "streamlit>=1.35,<2",
  "tqdm>=4.66,<5",
  "tomli-w>=1.2,<2",
  "typer>=0.12,<1",
  "jaxtyping>=0.3.9",
  "pytransform3d>=3.14.4",
  "PyYAML>=6,<7",
  "rerun-sdk==0.24.1",
  "pyliblzfse==0.4.1",
  "pandas==2.3.3",
]

  [project.optional-dependencies]
  dev = [
    "bibtex-updater>=0.8.0",
    "mypy>=1.11,<2",
    "pre-commit>=4.2,<5",
    "pybind11-stubgen>=2.5,<3",
    "pytest>=8.3,<9",
    "pytest-xdist>=3.6,<4",
    "rebiber>=1.1.3",
    "ruff>=0.11,<1",
  ]
  replay = []
  streaming = ["aiortc>=1.9,<2", "record3d>=1.4.1,<2"]
  mast3r = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "xformers",
    "MAST3R-SLAM",
    "MAST3R",
    "in3d",
    # Source anchors for upstream local-path transitive dependencies.
    "asmk",
    "curope; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "imgui",
  ]
  vista = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "xformers",
    "pypose>=0.6",
    "einops>=0.6",
    "munch>=2.5",
    "pykdtree>=1.3",
    "tensorboard>=2.14,<3",
    "DBoW3Py",
  ]

  [project.scripts]
  prml-vslam = "prml_vslam.main:main"
  prml_vslam = "prml_vslam.main:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prml_vslam"]

[tool.ruff]
target-version = "py311"
line-length    = 120
extend-exclude = ["external", "typings/open3d", ".claude"]

  [tool.ruff.lint]
  select = ["B", "E", "F", "I", "UP"]
  ignore = ["E501"]

  [tool.ruff.format]
  quote-style  = "double"
  indent-style = "space"
  line-ending  = "auto"

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-vv -ra --strict-markers --capture=no -p no:dash"

[tool.uv]
conflicts               = [[{ extra = "mast3r" }, { extra = "vista" }]]
constraint-dependencies = ["click==8.3.1", "starlette==1.0.0"]

  [tool.uv.extra-build-dependencies]
  MAST3R-SLAM = ["torch==2.5.1"]
  curope      = ["torch==2.5.1"]
  xformers    = ["torch==2.5.1"]

  [tool.uv.sources]
  DBoW3Py     = { path = "external/vista-slam/DBoW3Py", editable = false }
  MAST3R-SLAM = { path = "external/mast3r-slam", editable = true }
  MAST3R      = { path = "external/mast3r-slam/thirdparty/mast3r", editable = true }
  in3d        = { path = "external/mast3r-slam/thirdparty/in3d", editable = true }
  asmk        = { path = "external/mast3r-slam/thirdparty/mast3r/asmk", editable = true }
  curope      = { path = "external/mast3r-slam/thirdparty/mast3r/dust3r/croco/models/curope", editable = true, marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
  imgui       = { path = "external/mast3r-slam/thirdparty/in3d/thirdparty/pyimgui", editable = true }

  # These metadata overrides replace upstream dynamic local file-URI dependencies
  # with portable path-source names so uv can lock the optional MASt3R graph.
  [[tool.uv.dependency-metadata]]
  name = "MAST3R-SLAM"
  version = "0.0.1"
  requires-dist = [
    # Upstream pins numpy==1.26.4, but the repo-owned Rerun stack requires NumPy 2.
    "numpy>=1.26,<3",
    "einops",
    "pyrealsense2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "evo",
    "natsort",
    "lietorch @ git+https://github.com/princeton-vl/lietorch.git@e7df86554156b36846008d8ddbcc4d8521a16554",
    "plyfile",
  ]

  [[tool.uv.dependency-metadata]]
  name = "MAST3R"
  version = "0.0.1"
  requires-dist = [
    "scikit-learn",
    "roma",
    "matplotlib",
    "tqdm",
    "opencv-python",
    "scipy",
    "einops",
    "trimesh",
    "tensorboard",
    "pyglet",
    "huggingface-hub[torch]>=0.22",
    "curope; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "asmk",
  ]

  [[tool.uv.dependency-metadata]]
  name = "in3d"
  version = "0.0.1"
  requires-dist = [
    "imgui",
    "moderngl==5.12.0",
    "moderngl-window>=2.4.6",
    "glfw",
    "pyglm",
    "msgpack",
    "numpy",
    "matplotlib",
    "trimesh[easy]",
  ]

  [[tool.uv.dependency-metadata]]
  name          = "curope"
  version       = "0.0.0"
  requires-dist = []

[tool.mypy]
python_version      = "3.11"
strict              = false
warn_unused_configs = true
packages            = ["prml_vslam"]
mypy_path           = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/typings"]

  [[tool.mypy.overrides]]
  module = [
    "cv2",
    "cv2.*",
    "numpy",
    "numpy.*",
    "pydantic",
    "pydantic.*",
    "pytest",
    "pytest.*",
    "streamlit",
    "streamlit.*",
    "tomli_w",
    "tomli_w.*",
    "torch",
    "torch.*",
  ]
  ignore_missing_imports = true

  [[tool.mypy.overrides]]
  module        = ["open3d", "open3d.*"]
  ignore_errors = true

[tool.pyright]
include    = ["src", "tests", "typings"]
extraPaths = ["src"]
stubPath   = "typings"

[dependency-groups]
dev = ["graphifyy>=0.4.26", "mcp>=1.27.0"]
