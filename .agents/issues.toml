[[issues]]
id = "ISSUE-0074"
title = "Rerun live viewer routing still needs throughput guardrails after the blueprint fix"
status = "open"
priority = "high"
category = "visualization"
summary = "A 2026-05-31 `vista-full-tuning` streaming run completed with the online Rerun viewer missing live/source/SLAM imagery and point-cloud surfaces. The branch now regenerates the checked-in blueprint, disables default pose-axis fanout, preserves persistent keyframe frusta, and restores the expected `world/slam/vista_slam_world/...` live/export entities, but the ADVIO-20 streaming smoke still emits live/export sidecar lag warnings and repeated Rerun gRPC flush timeouts. The remaining risk is throughput/backpressure and graceful sink shutdown rather than stale blueprint paths."
files = [
    "src/prml_vslam/main.py",
    "src/prml_vslam/pipeline/ray_runtime/coordinator.py",
    "src/prml_vslam/visualization/rerun.py",
    "src/prml_vslam/visualization/rerun_sink.py",
    "src/prml_vslam/visualization/rerun_policy.py",
    ".configs/visualization/vista_blueprint.rbl",
    ".configs/pipelines/vista-full.toml",
    "tests/test_pipeline.py",
    "tests/test_rerun_layout_semantics.py",
]
notes = [
    "The stale checked-in blueprint portion is resolved by regenerating `.configs/visualization/vista_blueprint.rbl` from `build_default_blueprint()` and adding a byte-level guard that rejects stale `world/live/model` paths.",
    "`trajectory_pose_axis_length = 0.0` is now the committed `vista-full.toml` default, so long reference trajectories do not generate default-visible `/poses/XXXXXX` fanout unless explicitly requested.",
    "Selective routing is intentional: live receives SLAM runtime updates and lightweight source-reference trajectories, while reference point clouds, artifact visualizations, and final artifact fanout remain export-only.",
    "The bounded ADVIO-20 smoke on 2026-05-31 completed 300 frames and exported current `world/slam/vista_slam_world/live/model/...` paths, 48 keyed camera/point-cloud entities, and reference trajectories, with no stale `/world/live/model` path.",
    "The full current-config ADVIO-20 smoke on 2026-05-31 completed 500 frames and exported `world/slam/vista_slam_world/live/model/camera/image` with Pinhole+Image components, 76 persistent keyframe camera frusta, keyed pointmaps, Tango reference clouds, ARCore source/aligned trajectories, ARKit source-native trajectory, and the method-origin transform.",
    "That 500-frame smoke still produced repeated Rerun gRPC flush timeouts, live/export sidecar lag warnings at `max_consecutive_pending=1`, and a coordinator graceful-shutdown timeout after the stages reached completed state.",
    "The auto-launched Rerun viewer failed in that smoke because port 9090 was already in use, so the latest evidence comes from the exported RRD inventory and validation bundle rather than an online viewer screenshot.",
    "Throughput/backpressure or coalescing work remains open for sustained heavier runs even though the exported entity semantics now match the intended tree.",
    "`run-config` intentionally keeps the process alive while waiting for the Rerun viewer to close after the pipeline reaches a terminal state, so a still-running CLI parent is not proof that stages are still executing.",
]
