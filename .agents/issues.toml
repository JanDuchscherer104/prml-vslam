[[issues]]
id = "ISSUE-0030"
title = "Trajectory evaluation still lacks explicit alignment and drift semantics"
status = "in_progress"
priority = "high"
category = "evaluation"
summary = "Persisted trajectory evaluation now records explicit metric semantics, but the evaluator still computes only translation APE and does not yet expose drift-oriented RPE or alternative alignment modes beyond timestamp association."
wip_branch = "codex/streaming-execution-architecture"
wip_worktree = "/home/jandu/repos/prml-vslam"
files = [
    "src/prml_vslam/sources/contracts.py",
    "src/prml_vslam/eval/services.py",
    "src/prml_vslam/eval/contracts.py",
    "src/prml_vslam/pipeline/finalization.py",
    "README.md",
    "docs/Questions.md",
]
notes = [
    "The public config already separates trajectory evaluation enablement from `baseline_source`, so the old enablement-vs-baseline conflation is resolved.",
    "The evaluator now persists explicit semantics such as metric id, pose relation, alignment mode, and sync tolerance, which closes the earlier ambiguity in the stored payload.",
    "The remaining gap is executable drift-oriented RPE and richer alignment choices through the same thin evo seam, which still matters because trajectory quality is the top evaluation priority.",
]
