    "`_resolve_reference_cloud()` skips every reference whose `coordinate_status` is not `ALIGNED`, then requires `StageKey.RECONSTRUCTION` if no aligned source cloud is found.",
    "The ADVIO Tango high-RMS gate can preserve only a `SOURCE_NATIVE` cloud with rejection metadata, so this is a real plan/runtime mismatch rather than a theoretical missing file.",
]
