[[issues]]
id = "ISSUE-0055"
title = "Stage config and runtime ownership is still split across migration-era surfaces"
status = "in_progress"
priority = "high"
category = "orchestration"
summary = "The target architecture defines stage-local configs, runtimes, proxies, a runtime manager, and a result store, but the current executable path still has stage identity, planning, source policy, runtime invocation, failure provenance, and observer routing split across pipeline configs, coordinator code, runtime scaffolding, and legacy compatibility seams."
files = [
    "docs/architecture/pipeline-stage-present-state-audit.md",
    "docs/architecture/pipeline-stage-refactor-target.md",
    "docs/architecture/pipeline-dto-migration-ledger.md",
    "src/prml_vslam/pipeline/config.py",
    "src/prml_vslam/pipeline/runtime_manager.py",
    "src/prml_vslam/pipeline/runner.py",
    "src/prml_vslam/pipeline/ray_runtime/coordinator.py",
    "src/prml_vslam/pipeline/stages/base/config.py",
    "src/prml_vslam/pipeline/stages/base/proxy.py",
]
notes = [
    "The target docs make `RunConfig`, `StageBundle`, `StageConfig`, `RuntimeManager`, `StageRuntimeProxy`, `StageRunner`, and `StageResultStore` the ownership model for stages.",
    "PR #68 has implemented many of these targets, but the coordinator still owns too many concerns and stage-domain module shapes are not yet uniform.",
    "This issue tracks the architectural debt separately from narrow implementation bugs so future docstrings and refactor work can point readers to the target ownership model without pretending the migration is complete.",
]
sources = [
    "docs/architecture/pipeline-stage-present-state-audit.md",
    "docs/architecture/pipeline-stage-refactor-target.md",
    "docs/architecture/pipeline-refactor-work-packages/README.md",
    "src/prml_vslam/pipeline/REQUIREMENTS.md",
]

