[[issues]]
id = "ISSUE-0077"
title = "Offline ViSTA Rerun export drops generated keyframe update surfaces"
status = "open"
priority = "high"
category = "visualization"
summary = "Offline ViSTA runs buffer per-frame/keyframe `SlamUpdate` values inside `VistaSlamRuntime`, but `VistaSlamBackend.run_observations()` calls `runtime.step(...)` and then `runtime.finish()` without draining those updates through `SlamStageRuntime` into `StageRuntimeUpdate` visualizations. Offline exported RRDs therefore contain terminal raw trajectory/cloud artifacts but no live model, tracking, keyframe frusta, or keyframe pointmap entities."
files = [
    "src/prml_vslam/methods/vista/session.py",
    "src/prml_vslam/methods/vista/adapter.py",
    "src/prml_vslam/methods/stage/runtime.py",
    "src/prml_vslam/pipeline/ray_runtime/coordinator.py",
    "src/prml_vslam/visualization/rerun_policy.py",
    "tests/test_streaming_visualization.py",
]
notes = [
    "`vista-full.toml` currently runs in offline mode; the 2026-05-31 exported RRD has no `/world/slam/vista_slam_world/keyframes/**`, `/live/model/**`, or `/live/tracking/**` entities.",
    "The missing keyframe/raw pointmap data is not a blueprint-only issue because those entity paths are absent from the RRD inventory.",
    "The final raw dense cloud is present separately as `/world/slam/vista_slam_world/point_cloud/raw`; this issue tracks the lost per-keyframe/live update surface.",
    "Current worktree evidence: `src/prml_vslam/methods/vista/session.py` buffers updates in `VistaSlamRuntime._pending_updates`, while `src/prml_vslam/methods/vista/adapter.py` does not call `drain_updates()` in the offline `run_observations()` path.",
    "A future fix should either replay offline keyframe updates into the export stream with bounded payload policy or explicitly document and validate offline exports as terminal-artifact-only.",
]
sources = [
    ".configs/pipelines/vista-full.toml",
    ".logs/runs/vista-full-tuning/2026-05-31_17:30:35_vista-full-tuning.log",
    ".artifacts/vista-full-tuning/vista/visualization/viewer_recording.rrd",
