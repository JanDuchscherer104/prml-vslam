[[issues]]
id = "ISSUE-0081"
title = "ADVIO ARKit source-native references can survive while aligned references are silently dropped"
status = "open"
priority = "medium"
category = "sources"
summary = "ADVIO optional provider reference generation appends the source-native ARKit trajectory before attempting GT alignment. When the later alignment/projection step raises, the source-native reference remains but the aligned reference is absent, and the warning says the optional trajectory was skipped. The 2026-05-31 ADVIO-20 run produced ARKit source-native only, so viewer and benchmark outputs look incomplete and diagnostics do not tell users whether this is expected policy or a recoverable alignment failure."
files = [
    "src/prml_vslam/sources/datasets/advio/advio_sequence.py",
    "src/prml_vslam/sources/datasets/advio/advio_geometry.py",
    "src/prml_vslam/sources/contracts.py",
    "tests/test_advio.py",
]
notes = [
    "Current ADVIO-20 inputs include `arkit.tum` but no `arkit_aligned_to_gt.tum`; ARCore has both source-native and aligned references.",
    "The failure observed in the log is a rotation projection Frobenius error of 0.127458, above the current optional-provider alignment limit of 0.1.",
    "Current worktree evidence: `_append_optional_reference_trajectory()` appends the source-native `ReferenceTrajectoryRef` before calling `_ensure_aligned_advio_tum()`, and the single `except ValueError` warning covers failures from either phase.",
    "Resolved ISSUE-0075/TODO-0081 recovered sanitation for valid optional references, but this run shows the partial-source-native/absent-aligned case still needs explicit diagnostics and policy.",
]
sources = [
    ".logs/runs/vista-full-tuning/2026-05-31_17:30:35_vista-full-tuning.log",
    ".artifacts/vista-full-tuning/vista/benchmark/inputs.json",
    ".artifacts/vista-full-tuning/vista/benchmark/arkit.metadata.json",
    "src/prml_vslam/sources/datasets/advio/advio_sequence.py",
    "src/prml_vslam/sources/datasets/advio/advio_geometry.py",
]

[[issues]]
id = "ISSUE-0086"
title = "Offline ViSTA final dense cloud does not preserve streaming pointmap coverage"
status = "open"
priority = "medium"
category = "methods"
summary = "The final offline ViSTA `pointcloud.ply` is generated from upstream `save_data_all()` using confidence-masked fused depth maps, while streaming Rerun pointmaps come from `get_pointmap_vis()` and are logged as camera-local pointmaps without that final export mask. In the 2026-05-31 18:42 ADVIO-20 run, the final raw cloud contains 3,007,121 points from 455 keyframes, but the native confidence tensor has 22,830,080 pixels and only about 13.17% pass the export mask. This explains why `/world/slam/vista_slam_world/point_cloud/raw` misses points that were visible in streaming pointmaps."
files = [
    "external/vista-slam/vista_slam/slam.py",
    "src/prml_vslam/methods/vista/session.py",
    "src/prml_vslam/methods/vista/artifacts.py",
    "src/prml_vslam/methods/stage/visualization.py",
    "tests/test_methods.py",
    "tests/test_streaming_visualization.py",
]
notes = [
    "Upstream `save_data_all()` writes `pointcloud.ply` from `scaled_depths = depths * scales` and `masks = confs > self.conf_thres`; the repo then copies that fused PLY as the raw SLAM artifact.",
    "Streaming pointmaps use `get_pointmap_vis()` and the repo only treats finite `z > 0` rows as valid for live telemetry, so live/debug coverage and final benchmark-cloud coverage are intentionally different today.",
    "The 18:42 artifact inspection found `confs.npz` shape `[455, 224, 224]`, threshold 4.2, and 3,007,121 mask-positive pixels out of 22,830,080 total.",
    "This is separate from Rerun visibility: the RRD contains `/world/slam/vista_slam_world/point_cloud/raw` with the final PLY's points; the missing geometry is already absent from the final PLY surface.",
]
sources = [
    ".artifacts/vista-full-tuning/vista/native/confs.npz",
    ".artifacts/vista-full-tuning/vista/native/pointcloud.ply",
    ".artifacts/vista-full-tuning/vista/slam/point_cloud.ply",
    ".artifacts/vista-full-tuning/vista/visualization/viewer_recording.rrd",
    ".logs/runs/vista-full-tuning/2026-05-31_18:42:24_vista-full-tuning.log",
    "external/vista-slam/vista_slam/slam.py",
    "src/prml_vslam/methods/vista/session.py",
    "src/prml_vslam/methods/vista/artifacts.py",
]

