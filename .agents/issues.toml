    "src/prml_vslam/visualization/rerun_sink.py",
]
notes = [
    "The current type is list[SerializeAsAny[BaseData]], so any DTO can cross the live observer boundary without a minimal event contract.",
    "Introduce a small domain-event base, protocol, or narrow union so stage updates remain flexible without becoming an arbitrary DTO tunnel.",
    "Keep domain event payloads domain-owned; the pipeline should define only the transport shape and validation boundary.",
]
