]

[[issues]]
id = "ISSUE-0085"
title = "Trajectory Sim3 cloud alignment is weak and unconstrained by up-frame semantics"
status = "open"
priority = "high"
category = "evaluation"
summary = "The offline point-cloud benchmark path applies the trajectory Sim3 directly to the final ViSTA cloud before ICP/cloud metrics. In the 2026-05-31 18:42 ADVIO-20 run, the trajectory Sim3 has scale 5.49 and RMS 27.39 m, and its proper rotation includes large pitch/roll components. The resulting `/world/overlays/advio_gt_world/vista/sim3_aligned/point_cloud` is scene-scale but can look upside down or gravity-inconsistent in the viewer, so dense-cloud evaluation needs an explicit frame/up convention check instead of trusting unconstrained Umeyama output."
files = [
    "src/prml_vslam/eval/services.py",
    "src/prml_vslam/eval/stage_alignment/runtime.py",
    "src/prml_vslam/eval/stage_cloud_alignment/spec.py",
    "src/prml_vslam/eval/stage_cloud_alignment/runtime.py",
    "src/prml_vslam/sources/datasets/advio/advio_frames.py",
    "tests/test_eval.py",
]
notes = [
    "The stored trajectory Sim3 rotation has determinant about +1, so the observed inversion is not proven to be a literal reflection; the current evidence points to a weak full-3D alignment and unresolved RDF/RUF/up-frame convention validation.",
    "A 2026-05-31 follow-up probe found that allowing reflections or pre-applying signed axis permutations to the SLAM trajectory did not improve the 27.39 m Sim3 residual, which argues against a simple one-matrix ADVIO/VISTA basis flip.",
    "The 18:42 run's Sim3-aligned cloud spans about 163.8 x 27.8 x 176.1 m and its sampled dominant plane is near-horizontal in RDF coordinates, while the trajectory alignment residual remains 27.39 m.",
    "After fixing Tango reference-cloud materialization, the local ADVIO-20 Tango aligned cloud and ViSTA Sim3 cloud both have near-horizontal sampled dominant planes in the target RDF frame; the old invalid Tango cloud no longer explains the perceived ViSTA inversion by itself.",
    "A post-fix probe against the newly materialized ADVIO-20 `tango_raw_aligned.ply` still produced ICP fitness 0.0 and dense-cloud f-score 0.0 for the existing `point_cloud_sim3_aligned.ply`; Tango reference prep is no longer the only blocker for point-cloud metrics.",
    "The raw SLAM and reference trajectories show different apparent turn directions in the viewer before/after alignment; repository evidence does not yet isolate whether this is a source-frame convention issue, an ADVIO reference normalization issue, or poor trajectory association/alignment.",
    "The post-fix probe used the corrected Tango reference without rerunning ViSTA and still failed ICP, so the next patch should validate or gate the trajectory-Sim3 estimate before changing ViSTA frame conventions.",
]
sources = [
