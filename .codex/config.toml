model                          = "gpt-5.5"
model_auto_compact_token_limit = 400000
model_context_window           = 1050000
model_reasoning_effort         = "medium"
personality                    = 'pragmatic'
web_search                     = 'cached'

project_doc_fallback_filenames = ["AGENTS.md"]

[mcp_servers]

    [mcp_servers.code-index]
    command = "uvx"
    args    = ["code-index-mcp", "--project-path", "."]
    cwd     = "."

    [mcp_servers.graphify]
    command = "uv"
    args = [
        "run",
        "--preview-features",
        "extra-build-dependencies",
        "--group",
        "dev",
        "python",
        "-m",
        "graphify.serve",
        "graphify-out/graph.json",
    ]

    [mcp_servers.mempalace]
    command = "python3"
    args    = [".agents/skills/mempalace-repo/scripts/mempalace_repo.py", "mcp"]

[features]
unified_exec = true
multi_agent  = true
apps         = true
hooks        = true

[[skills.config]]
path    = "../.agents/skills/pydantic"
enabled = true

[[skills.config]]
path    = "../.agents/skills/understanding-streamlit-architecture"
enabled = true

[[skills.config]]
path    = "../.agents/skills/graphify"
enabled = true

[[skills.config]]
path    = "../.agents/skills/mempalace-repo"
enabled = true

[[skills.config]]
path    = "../.agents/skills/rerun-slam-integration"
enabled = true

[[skills.config]]
path    = "../.agents/skills/scientific-writing"
enabled = true
