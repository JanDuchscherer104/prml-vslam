# advio-15-offline-mast3r-smoke.toml
experiment_name = "advio-15-offline-mast3r-smoke"
mode            = "offline"
output_dir      = ".artifacts"

[stages.source]
enabled = true

    [stages.source.backend]
    source_id   = "tum_rgbd"
    sequence_id = "freiburg3_large_cabinet"

        [stages.source.backend.dataset_serving]
        pose_source     = "ground_truth"
        pose_frame_mode = "fixedpoint_common_start_local"

[stages.slam]
enabled = true

    [stages.slam.outputs]
    emit_dense_points  = true
    emit_sparse_points = false

    [stages.slam.backend]
    method_id            = "mast3r"
    max_frames           = 500
    img_size             = 224
    keyframe_buffer_size = 64

[stages.align_ground]
enabled = false
[stages.evaluate_trajectory]
enabled = false
[stages.reconstruction]
enabled = false
[stages.evaluate_cloud]
enabled = false
[stages.summary]
enabled = true

[visualization]
export_viewer_rrd     = false
connect_live_viewer   = true
grpc_url              = "rerun+http://127.0.0.1:9876/proxy"
preserve_native_rerun = true
