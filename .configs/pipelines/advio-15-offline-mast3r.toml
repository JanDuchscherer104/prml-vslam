# advio-15-offline-mast3r-smoke.toml
experiment_name = "advio-15-offline-mast3r-smoke"
mode            = "offline"
output_dir      = ".artifacts"

[stages.source]
enabled = true

    [stages.source.backend]
    source_id   = "advio"
    sequence_id = "advio-15"

        [stages.source.backend.dataset_serving]
        pose_source     = "ground_truth"
        pose_frame_mode = "provider_world"


[stages.slam]
enabled = true

    [stages.slam.outputs]
    emit_dense_points  = true
    emit_sparse_points = false

    [stages.slam.backend]
    method_id            = "mast3r"
    img_size             = 224
    keyframe_buffer_size = 64

[stages.align_ground]
enabled = false

[stages.align_trajectory]
enabled         = true
baseline_source = "ground_truth"

[stages.evaluate_trajectory]
enabled = true

    [stages.evaluate_trajectory.evaluation]
    baseline_source = "ground_truth"

[stages.reconstruction]
enabled = false
[stages.evaluate_cloud]
enabled = false
[stages.summary]
enabled = true

[visualization]
export_viewer_rrd     = false
connect_live_viewer   = true
grpc_url              = "rerun+http://127.0.0.1:9876/proxy"
preserve_native_rerun = true
