# Current-style MASt3R-SLAM smoke configuration.

experiment_name          = "mast3r-smoke-test"
mode                     = "offline"
output_dir               = ".artifacts"
ray_local_head_lifecycle = "ephemeral"

[stages.source]
enabled = true

    [stages.source.backend]
    source_id    = "advio"
    sequence_id  = "advio-15"
    frame_stride = 10

[stages.slam]
enabled  = true
num_gpus = 1.0
affinity = "gpu-node"

    [stages.slam.outputs]
    emit_dense_points  = true
    emit_sparse_points = false

    [stages.slam.backend]
    method_id  = "mast3r"
    max_frames = 30

[stages.align_ground]
enabled = false

[stages.evaluate_trajectory]
enabled = false

[stages.reconstruction]
enabled = false

[stages.evaluate_cloud]
enabled = false

[stages.summary]
enabled = true

[visualization]
connect_live_viewer   = false
export_viewer_rrd     = false
preserve_native_rerun = false
