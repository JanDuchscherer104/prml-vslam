# LingBot-Map Pipeline Configuration
# ----------------------------------
# Mirrors vista-full source/downstream artifacts where the offline LingBot-Map
# backend supports them.

experiment_name          = "lingbot-full-tuning-gpu"
mode                     = "offline"
output_dir               = ".artifacts"
ray_local_head_lifecycle = "ephemeral"

[stages.source]
enabled = true

    [stages.source.backend]
    source_id   = "tum_rgbd"
    sequence_id = "freiburg3_large_cabinet"
    # frame_stride = 5
    replay_mode = "fast_as_possible"

[stages.slam]
enabled  = true
num_gpus = 1.0
affinity = "gpu-node"

emit_progress           = true
emit_queue_metrics      = true
emit_latency_metrics    = true
emit_throughput_metrics = true
sampling_interval_ms    = 1000

    [stages.slam.outputs]
    emit_dense_points  = true
    emit_sparse_points = false

    [stages.slam.backend]
    method_id = "lingbot_map"
    # max_frames = 1500

    lingbot_map_dir         = "external/lingbot-map"
    checkpoint_path         = "external/lingbot-map/checkpoints/lingbot-map.pt"
    device                  = "cuda"
    mode                    = "streaming"
    image_size              = 336
    patch_size              = 14
    enable_3d_rope          = true
    max_frame_num           = 1024
    num_scale_frames        = 2
    kv_cache_sliding_window = 64
    keyframe_interval       = 4
    use_sdpa                = true
    use_amp                 = true
    model_dtype             = "auto"
    checkpoint_pos_embed    = "interpolate"
    camera_num_iterations   = 4
    enable_point_head       = false
    confidence_threshold    = 0.0
    point_stride            = 4
    max_points              = 100000
    max_depth_m             = 100.0

[stages.align_ground]
enabled = true

    [stages.align_ground.ground]
    strategy       = "ransac_point_cloud"
    min_confidence = 0.6

[stages.evaluate_trajectory]
enabled = true

[stages.align_trajectory]
enabled = true

[stages.align_cloud]
enabled                       = true
max_correspondence_distance_m = 0.1

[stages.reconstruction]
enabled = false

[stages.evaluate_cloud]
enabled = false

[stages.summary]
enabled = true

[visualization]
connect_live_viewer               = false
export_viewer_rrd                 = true
grpc_url                          = "rerun+http://127.0.0.1:9876/proxy"
viewer_blueprint_path             = ".configs/visualization/vista_blueprint.rbl"
preserve_native_rerun             = false
log_source_rgb                    = false
log_diagnostic_preview            = false
log_camera_image_rgb              = false
show_tracking_trajectory          = true
trajectory_pose_axis_length       = 0.0
point_cloud_decimation_keep_ratio = 0.99
mesh_decimation_keep_ratio        = 0.25
decimation_random_seed            = 0
