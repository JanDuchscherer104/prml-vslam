# Canonical MASt3R-SLAM Pipeline Configuration
# -------------------------------------------
# This file defines a complete pipeline run config, including the source, SLAM
# backend overrides, stage-local evaluation/reconstruction policy, and
# visualization settings.
# mamba activate prml-vslam
# uv run --extra mast3r prml-vslam run-config .configs/pipelines/mast3r-full.toml
# uv run rerun .artifacts/mast3r-tum-cabinet-full/mast3r/visualization/viewer_recording.rrd --serve-web


experiment_name          = "mast3r-tum-freiburg3_large_cabinet"
mode                     = "offline"
output_dir               = ".artifacts"
ray_local_head_lifecycle = "ephemeral"

[stages.source]
enabled = true

    [stages.source.backend]
    source_id    = "tum_rgbd"
    sequence_id  = "freiburg3_large_cabinet"
    frame_stride = 1
    replay_mode  = "fast_as_possible"

[stages.slam]
enabled = true

# --- Resource & Placement Policy ---
# num_cpus = 1.0
num_gpus = 1.0
affinity = "gpu-node"
# memory_bytes = 4294967296  # 4GB

# --- Telemetry Policy ---
emit_progress           = true
emit_queue_metrics      = true
emit_latency_metrics    = true
emit_throughput_metrics = true
sampling_interval_ms    = 1000

    [stages.slam.outputs]

    # MASt3R-SLAM exports dense pointmaps, not a separate sparse landmark cloud.
    emit_dense_points  = true
    emit_sparse_points = false

    [stages.slam.backend]
    method_id = "mast3r"
    # Comparable to ViSTA `max_frames`: shared pipeline frame cap before backend-specific
    # keyframe selection and graph construction.
    # max_frames = 1500

    # Paper/upstream MASt3R-SLAM no-calibration preset.
    # Comparable to ViSTA's explicit backend graph/keyframe parameters below:
    # this YAML owns MASt3R tracking, local optimization, matching, retrieval,
    # and relocalization thresholds.
    yaml_config_path = "external/mast3r-slam/config/base.yaml"

    # Comparable to ViSTA's intrinsic-free STA frontend. Keep false for the
    # uncalibrated benchmark; ViSTA estimates intrinsics internally instead of
    # consuming source calibration.
    use_calib = false

    # Upstream model/runtime defaults used for reported MASt3R-SLAM results.
    # Comparable to ViSTA's fixed 224x224 model raster. Do not force these equal:
    # each backend's pretrained frontend expects its own native resolution.
    img_size = 512

    # Comparable to ViSTA `max_view_num`: upper bound on retained/preallocated
    # keyframes before the backend would be capacity-limited.
    # Upstream/default MASt3R-SLAM buffer is 512
    # (`SharedKeyframes(..., buffer=512)`); this low-VRAM run intentionally
    # reduces it to 32. For paper-faithful comparison, use 512 and set ViSTA
    # `max_view_num = 400` from the TUM-RGBD paper/eval preset.
    keyframe_buffer_size = 32

    # Comparable to ViSTA `point_conf_thres`: confidence filter used when
    # exporting dense reconstruction points.
    c_conf_threshold = 1.5

[stages.align_ground]
enabled = true

    [stages.align_ground.ground]
    strategy       = "ransac_point_cloud"
    min_confidence = 0.6

[stages.align_cloud]
enabled = true
# Tight ICP correspondence gate for cluttered SLAM clouds; larger values can
# pull the aligned cloud toward wrong nearby surfaces.
max_correspondence_distance_m = 0.02

[stages.evaluate_trajectory]
enabled = true

[stages.evaluate_cloud]
enabled = true

[stages.align_trajectory]
enabled = true

[stages.summary]
enabled = true

# ------------------------------------------
# Visualization Configuration
# ------------------------------------------
[visualization]
# Whether to connect the Rerun live viewer via gRPC.
connect_live_viewer = false

# Whether one canonical repo-owned `.rrd` recording should be exported.
export_viewer_rrd = true

# Rerun gRPC endpoint used when `connect_live_viewer` is enabled.
grpc_url = "rerun+http://127.0.0.1:9876/proxy"

# Optional Rerun blueprint loaded by the auto-launched web viewer.
viewer_blueprint_path = ".configs/visualization/vista_blueprint.rbl"

# Whether native upstream `.rrd` recordings should be preserved.
preserve_native_rerun = true

# Whether to log original source RGB frames.
log_source_rgb = false

# Whether to log method-specific diagnostic/preview images.
log_diagnostic_preview = false

# Whether to project the RGB image onto the 3D camera frustum.
log_camera_image_rgb = false

# Keep only a few recent frusta visible in the streaming viewer.

# Keep the full tracking trajectory visible.
show_tracking_trajectory = true

# Keep dense reference trajectories compact.
trajectory_pose_axis_length = 0.0

# Reduce geometry logged to Rerun while preserving full benchmark artifacts.
point_cloud_decimation_keep_ratio = 0.25
mesh_decimation_keep_ratio        = 0.25
decimation_random_seed            = 0
