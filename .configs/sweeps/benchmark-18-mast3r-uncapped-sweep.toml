# MASt3R-SLAM 18-scene sweep with no SLAM max_frames cap.
#
# This supersedes benchmark-18-mast3r-sweep.toml, whose MASt3R template used
# max_frames=50 during the previous run, and benchmark-18-mast3r-512-sweep.toml,
# which was interrupted after two completed runs.  The distinct sweep name keeps
# the uncapped artifacts separate from those capped/partial sweeps.
#
# Requires the mast3r extra (conflicts with vista and lingbot; install separately):
#   mamba activate prml-vslam
#   export UV_PROJECT_ENVIRONMENT=$CONDA_PREFIX
#   uv sync --extra dev --extra streaming --extra mast3r
#
# Inspect the expanded plan (no execution):
#   uv run prml-vslam plan-sweep-config .configs/sweeps/benchmark-18-mast3r-uncapped-sweep.toml
#
# Execute sequentially, attempting all runs:
#   uv run --extra mast3r prml-vslam run-sweep-config .configs/sweeps/benchmark-18-mast3r-uncapped-sweep.toml \
#       --continue-on-failure

[sweep]
name       = "benchmark-18-mast3r-uncapped"
output_dir = ".artifacts/sweeps"

# -- TUM RGB-D -----------------------------------------------------------------

[[datasets]]
dataset_id          = "tum_rgbd"
sequence_id         = "freiburg1_360"
frame_stride        = 1
replay_mode         = "fast_as_possible"
baseline_source     = "ground_truth"
align_ground        = true
align_trajectory    = true
evaluate_trajectory = true
evaluate_cloud      = true
align_cloud         = true
align_cloud_max_correspondence_distance_m = 0.02

