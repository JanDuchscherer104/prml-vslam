# LingBot-Map 18-scene sweep: 6 TUM RGB-D + 6 ADVIO + 6 Record3D.
#
# Uses the same benchmark-18 scene set as the MASt3R/VISTA sweeps, with the
# LingBot method parameters from .configs/pipelines/lingbot-full.toml.
#
# Inspect the expanded plan (no execution):
#   uv run prml-vslam plan-sweep-config .configs/sweeps/benchmark-18-lingbot-sweep.toml
#
# Execute sequentially, attempting all runs:
#   uv run --extra lingbot prml-vslam run-sweep-config .configs/sweeps/benchmark-18-lingbot-sweep.toml \
#       --continue-on-failure

[sweep]
name       = "benchmark-18-lingbot"
output_dir = ".artifacts/sweeps"

# -- TUM RGB-D -----------------------------------------------------------------

[[datasets]]
dataset_id          = "tum_rgbd"
sequence_id         = "freiburg1_360"
frame_stride        = 1
replay_mode         = "fast_as_possible"
baseline_source     = "ground_truth"
align_ground        = true
align_trajectory    = true
evaluate_trajectory = true
evaluate_cloud      = true
align_cloud         = true
align_cloud_max_correspondence_distance_m = 0.2

